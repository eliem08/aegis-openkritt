[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-policy"
version = "0.3.0"
description = "Deterministic policy & authorization core for the Autonomous Exposure-to-Fix Agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "eliem08" }]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "httpx>=0.27", "cryptography>=42"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "cryptography>=42"]
# Scope-enforcing outbound client + DeepSeek LLM planner both use httpx only.
ai = ["httpx>=0.27"]
net = ["httpx>=0.27"]
# Ed25519 asymmetric authorization signatures.
crypto = ["cryptography>=42"]
# Postgres durable store (SQLite needs no extra — it's stdlib).
postgres = ["psycopg[binary]>=3.1", "psycopg_pool>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis = ["py.typed", "ai/rules/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Upstream Starlette TestClient deprecation (httpx -> httpx2); no action for
    # us until the replacement is released. Suppress so the suite is clean.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
