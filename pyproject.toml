[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Identity aligned with the actual system: Aegis is a full agentic, evidence-led,
# profit-aware bug-bounty research platform — not just the policy core. Versioning is
# semantic-ish 0.MAJOR.MINOR while pre-1.0; 0.6 was the "profit-first foundations" line,
# 0.7 is the correctness/hardening pass (canonical identity, real benchmark, CI gates).
name = "aegis"
version = "0.7.0"
description = "Aegis — agentic, evidence-led, profit-aware bug-bounty research platform (authorized use only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "eliem08" }]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "httpx>=0.27", "cryptography>=42", "PyYAML>=6.0", "grpcio>=1.65", "protobuf>=5"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "cryptography>=42", "grpcio>=1.65", "protobuf>=5"]
# Scope-enforcing outbound client + DeepSeek LLM planner both use httpx only.
ai = ["httpx>=0.27", "PyYAML>=6.0"]
net = ["httpx>=0.27", "grpcio>=1.65", "protobuf>=5"]
# Ed25519 asymmetric authorization signatures.
crypto = ["cryptography>=42"]
# Postgres durable store (SQLite needs no extra — it's stdlib).
postgres = ["psycopg[binary]>=3.1", "psycopg_pool>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis = ["py.typed", "ai/rules/*.yml"]

[tool.pytest.ini_options]
# "tests" is on the path so shared helpers (tests/policy_helpers.py) import cleanly even
# though tests/ is a package (tests/__init__.py) — without it, `from policy_helpers import ...`
# in conftest.py fails to resolve under pytest's prepend import mode.
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Upstream Starlette TestClient deprecation (httpx -> httpx2); no action for
    # us until the replacement is released. Suppress so the suite is clean.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin a meaningful, satisfiable rule set. ruff's broad version-default flagged ~460 mostly-
# stylistic issues (line-length, blind-except, try-except-pass) that this deliberately
# defensive codebase doesn't follow — so lint was perpetually red and ignored. Enforce the
# rules that catch REAL bugs instead: F (pyflakes: undefined names, unused vars/imports),
# E9 (syntax errors), I (import sorting). Green + actually useful.
select = ["F", "E9", "I"]
