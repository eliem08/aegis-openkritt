name: Aegis Self Hunt

on:
  workflow_dispatch:
  push:
    branches: [agent/operator-ui-autohunt]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/self-hunt.yml"

permissions:
  contents: read

jobs:
  self-hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aegis + pinned local scanners
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai]"
          pip install "semgrep==1.172.0" "bandit==1.8.6" "detect-secrets==1.5.0" "pip-audit==2.9.0"
      - name: Run autonomous self-hunt (authorized local checkout only)
        env:
          AEGIS_SCANNER_CONCURRENCY: "4"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from aegis.ai.tool_bridge import ToolBridge, available_tools

          lanes = ("code", "secrets", "deps")
          tools = []
          for lane in lanes:
              tools.extend(available_tools(lane))
          tools = list({tool.name: tool for tool in tools}.values())
          if not tools:
              raise SystemExit("no real scanners resolved on PATH")

          events = []
          def emit(kind, data):
              events.append({"kind": kind, "data": data})
              print(kind, json.dumps(data, sort_keys=True))

          bridge = ToolBridge(timeout=600)
          results = bridge.scan(".", tools=tools, on_event=emit)
          findings = bridge.findings(results)
          report = {
              "target": "eliem08/aegis-openkritt",
              "authorization": "repository-owner self-audit",
              "mode": "local-static-candidate-hunt",
              "evidence_stage": "candidate",
              "tools": [
                  {"tool": r.tool, "ran": r.ran, "count": len(r.findings), "error": r.error}
                  for r in results
              ],
              "candidate_count": len(findings),
              "findings": findings,
              "events": events,
              "note": "Scanner observations are unverified candidates, not reproduced vulnerabilities.",
          }
          out = Path("reports/self_hunt")
          out.mkdir(parents=True, exist_ok=True)
          (out / "self_hunt.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps({"candidate_count": len(findings), "tools": [r.tool for r in results]}, indent=2))
          PY
      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-self-hunt-${{ github.sha }}
          path: reports/self_hunt/self_hunt.json
          if-no-files-found: error
          retention-days: 14
