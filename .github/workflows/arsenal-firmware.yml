name: Arsenal Firmware

on:
  workflow_dispatch:
    inputs:
      full_emulation:
        description: "Run full QEMU/binfmt emulation pipeline"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  arsenal-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 binfmt-support squashfs-tools
          pip install -e ".[dev]"
      - name: Execute Firmware Architecture & Emulation Fixture Suite
        run: |
          pytest -q tests/arsenal/test_external_fixtures.py -k "firmware or firmae"
          python -m aegis.cli arsenal exercise --capability asset:aegis-firmware-arch/firmware-architecture-detection --runs-dir reports/operator-runs
          python -m aegis.cli arsenal exercise --capability asset:firmae/firmware-emulation --runs-dir reports/operator-runs
