name: Arsenal Firmware

on:
  workflow_dispatch:
    inputs:
      full_emulation:
        description: "Run full QEMU/binfmt emulation pipeline"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  arsenal-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 binfmt-support squashfs-tools
          pip install -e ".[dev,api]"
      - name: Execute Firmware Architecture & Emulation Fixture Suite
        run: |
          pytest -q tests/arsenal/test_external_fixtures.py
          # Firmware emulation requires KVM + FirmAE (unavailable on GitHub-hosted runners).
          # The exercise CLI exits 1 with WAITING_FOR_PREREQUISITE when these are missing.
          # Treat that as a skip (warning), not a failure. Real execution failures still fail.
          for cap in "asset:aegis-firmware-arch/firmware-architecture-detection" "asset:firmae/firmware-emulation"; do
            out=$(python -m aegis.cli arsenal exercise --capability "$cap" --runs-dir reports/operator-runs 2>&1) || true
            result=$(echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['result'])" 2>/dev/null || echo "PARSE_ERROR")
            if [ "$result" = "WAITING_FOR_PREREQUISITE" ]; then
              echo "::warning::Skipped $cap: prerequisites unavailable on this runner (expected on GitHub-hosted runners; needs KVM + FirmAE)"
            elif [ "$result" = "EXECUTED_PASS" ]; then
              echo "Passed $cap"
            else
              echo "::error::Exercise $cap failed with result: $result"
              echo "$out" | tail -20
              exit 1
            fi
          done
