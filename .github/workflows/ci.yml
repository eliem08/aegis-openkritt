name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src

  effectiveness-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis_test
          POSTGRES_PASSWORD: aegis_test_password
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis_test -d aegis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AEGIS_TEST_POSTGRES_DSN: postgresql://aegis_test:aegis_test_password@127.0.0.1:5432/aegis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test dependencies
        run: pip install -e ".[dev,postgres]"
      - name: Validate authoritative effectiveness ledger
        run: pytest -q tests/effectiveness/test_postgres.py tests/arsenal/test_arsenal_postgres.py

  bench:
    # Aegis-Bench is a canonical detector regression/sanity gate, not evidence of
    # real-world precision or runtime vulnerability reproduction. The CI lane is
    # intentionally reproducible and exercises the bundled Semgrep rules with a
    # fixed scanner version. Richer external-tool benchmarks belong in dedicated
    # integration/nightly environments with their own pinned manifests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (deps + pinned Semgrep)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai]"
          pip install "semgrep==1.172.0"
      - name: Run Aegis-Bench (detector regression metrics)
        run: python -m aegis.bench
      - name: Zero-regression gate (all canonical positives, zero clean-twin FPs)
        env:
          AEGIS_BENCH_STRICT: "1"
        run: pytest -q tests/bench/test_aegis_bench.py
