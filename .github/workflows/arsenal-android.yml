name: Arsenal Android

on:
  workflow_dispatch:
    inputs:
      full_emulator:
        description: "Launch hardware emulator"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

jobs:
  arsenal-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Android and CLI tools
        run: |
          sudo apt-get update && sudo apt-get install -y adb openjdk-17-jdk
          pip install -e ".[dev,api]"
          pip install frida-tools objection
      - name: Execute Android synthetic fixture suite (Frida, Objection, MobSF)
        run: |
          pytest -q tests/arsenal/test_external_fixtures.py
          # Android runtime exercises require an operator-owned emulator/device with Frida
          # (unavailable on GitHub-hosted runners). The exercise CLI exits 1 with
          # WAITING_FOR_PREREQUISITE when these are missing. Treat that as a skip
          # (warning), not a failure. Real execution failures still fail.
          for cap in "asset:frida/android-runtime-instrumentation" "asset:objection/android-runtime-exploration" "asset:mobsf/rest-static-analysis"; do
            out=$(python -m aegis.cli arsenal exercise --capability "$cap" --runs-dir reports/operator-runs 2>&1) || true
            result=$(echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['result'])" 2>/dev/null || echo "PARSE_ERROR")
            if [ "$result" = "WAITING_FOR_PREREQUISITE" ]; then
              echo "::warning::Skipped $cap: prerequisites unavailable on this runner (expected on GitHub-hosted runners; needs Android emulator + Frida)"
            elif [ "$result" = "EXECUTED_PASS" ]; then
              echo "Passed $cap"
            else
              echo "::error::Exercise $cap failed with result: $result"
              echo "$out" | tail -20
              exit 1
            fi
          done
